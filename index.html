<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>

    <link rel="stylesheet" href="./bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-4">
        <div class="bg-primary text-white p-4 rounded-3 mb-4">
            <h2 class="fw-bold">Quản lý danh sách sản phẩm</h2>
            <p class="mb-0">Giao diện nhập liệu và hiển thị danh sách sản phẩm một cách trực quan, rõ ràng.</p>
        </div>

        <div class="row">
            <div class="col-lg-4 mb-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="fw-bold">Thêm sản phẩm mới</h5>
                        <p class="text-muted small">Nhập đầy đủ thông tin để thêm sản phẩm vào danh sách.</p>

                        <form>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">Tên sản phẩm</label>
                                <input type="text" class="form-control" placeholder="Nhập tên sản phẩm">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">Danh mục</label>
                                <select class="form-select">
                                    <option>-- Chọn danh mục --</option>
                                    <option>Điện thoại</option>
                                    <option>Laptop</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">Giá</label>
                                <input type="number" class="form-control" placeholder="Nhập giá">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">Trạng thái còn hàng</label>
                                <select class="form-select">
                                    <option>Còn hàng</option>
                                    <option>Hết hàng</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-primary w-100">Thêm sản phẩm</button>
                                <button type="button" class="btn btn-light border w-50 text-nowrap">Làm mới form</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            

        </div>
    </div>

    <script src="./bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
